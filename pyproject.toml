[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nubevigor-calltrace"
version = "0.1.0"
description = "接口调用记录与脱敏，产出可重放证据"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nubevigor" }]
keywords = ["http", "tracing", "debugging", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nubevigor/calltrace"
Repository = "https://github.com/nubevigor/calltrace"
Issues = "https://github.com/nubevigor/calltrace/issues"

[project.scripts]
calltrace = "calltrace:main"

[tool.setuptools]
py-modules = ["calltrace"]
